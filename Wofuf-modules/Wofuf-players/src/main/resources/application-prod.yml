# ===================== Players Production Profile =====================

debug: false

secretKey: ${PLAYERS_SECRET_KEY:secretKey}

server:
  port: 8002

spring:
  application:
    name: modules-players

  # ===================== Database =====================
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:db}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:Woffo_db}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:Woffo_db_user}
    password: ${MYSQL_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: WofufHikariPool
      maximum-pool-size: ${DB_MAX_POOL:10}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000

  # ===================== JPA =====================
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  # ===================== Kafka =====================
  kafka:
    bootstrap-servers: ${KAFKA_HOST:kafka}:${KAFKA_PORT:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring:
          json:
            add:
              type:
                header: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: true

  # ===================== Spring Cloud Stream =====================
  cloud:
    stream:
      bindings:
        orderEventProcessor-in-0:
          destination: domain-events-topic
          group: modules-players-group
          content-type: application/json
      kafka:
        binder:
          brokers: ${KAFKA_HOST:kafka}:${KAFKA_PORT:9092}
          auto-create-topics: true
        bindings:
          orderEventProcessor-in-0:
            consumer:
              enable-dlq: true
              dlq-name: modules-players-dlq

# ===================== Players Module =====================
collector:
  players:
    delay-ms: 60000
    pop-delay-ms: 600000

plugin:
  api:
    base-url: ${PLUGIN_API_BASE_URL:http://127.0.0.1:8080}
    backup-skin-url-with-extension-png: ${SKIN_BACKUP_URL:https://littleskin.cn/skin}

players:
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: "${REDIS_PASSWORD:}"
    database: 1

# ===================== Eureka =====================
eureka:
  client:
    serviceUrl:
      defaultZone: http://${EUREKA_HOST:discovery}:${EUREKA_PORT:8761}/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
