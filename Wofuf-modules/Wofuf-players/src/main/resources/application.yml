# ===================== players =====================
secretKey: secretKey

collector:
  players:
    delay-ms: 60000
    pop-delay-ms: 600000

plugin:
  api:
    base-url: http://127.0.0.1:8080
    backup-skin-url-with-extension-png: https://littleskin.cn/skin

players:
  redis:
    host: localhost
    port: 6380
    password: ""
    database: 1

# ===================== Spring Boot =====================
debug: true
server:
  port: 8002

spring:
  application:
    name: modules-players

  # ===================== Database =====================
  datasource:
    url: jdbc:mysql://localhost:3307/Woffo_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: Woffo_db_user
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: WofufHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  # ===================== JPA/Hibernate =====================
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  # ===================== Redis =====================
#  data:
#    redis:
#      host: localhost
#      port: 6380
#      password: ""
#      database: 0
#      lettuce:
#        pool:
#          max-active: 8
#          max-wait: -1
#          max-idle: 8
#          min-idle: 0
#        shutdown-timeout: 100ms

  # ===================== Kafka =====================
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring:
          json:
            add:
              type:
                header: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: true

  # ===================== Spring Cloud Stream =====================
  cloud:
    stream:
      bindings:
        orderEventProcessor-in-0:
          destination: domain-events-topic
          group: domain-events-group
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092
          auto-create-topics: true
        bindings:
          orderEventProcessor-in-0:
            consumer:
              enable-dlq: true
              dlq-name: domain-events-dlq