server:
  port: 8761

# ===================== Eureka =====================
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true

# ===================== Security =====================
spring:
  application:
    name: infra-discovery

  cloud:
    discovery:
      enabled: true
