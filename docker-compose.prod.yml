services:
  # ===================== Application Services =====================

  wofuf-frontend:
    container_name: wofuf-frontend
    image: wofuf-frontend:latest
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      wofuf-backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wofuf-network

  wofuf-backend:
    container_name: wofuf-backend
    image: wofuf-backend:latest
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      MYSQL_HOST: ${MYSQL_HOST:-db}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-Woffo_db}
      MYSQL_USER: ${MYSQL_USER:-Woffo_db_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      KAFKA_HOST: ${KAFKA_HOST:-kafka}
      KAFKA_PORT: ${KAFKA_PORT:-9092}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-must-be-at-least-32-bytes-long-and-secure!}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      MINIO_HOST: ${MINIO_HOST:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${BACKEND_PORT:-8005}:8005"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8005/ | grep -q '404\\|200\\|302'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - wofuf-network

  # ===================== Infrastructure Services (Optional) =====================
  # Start with: docker compose --profile infra up -d

  db:
    container_name: wofuf-db
    image: mysql:8.0
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-Woffo_db}
      MYSQL_USER: ${MYSQL_USER:-Woffo_db_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - wofuf-network
    profiles:
      - infra

  redis:
    container_name: wofuf-redis
    image: redis:7-alpine
    ports:
      - "${REDIS_EXTERNAL_PORT:-6380}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - wofuf-network
    profiles:
      - infra

  kafka:
    container_name: wofuf-kafka
    image: apache/kafka:latest
    user: "0:0"
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
      - "${KAFKA_CONTROLLER_PORT:-9093}:9093"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qw=="
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: "/home/kafka/data"
    volumes:
      - kafka-data:/home/kafka/data
    restart: unless-stopped
    networks:
      - wofuf-network
    profiles:
      - infra

  minio:
    container_name: wofuf-minio
    image: minio/minio:latest
    ports:
      - "${MINIO_EXTERNAL_PORT:-9000}:9000"
      - "${MINIO_EXTERNAL_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - wofuf-network
    profiles:
      - infra

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  minio-data:

networks:
  wofuf-network:
    driver: bridge
